name: Windows

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: PS5 payload SDK tag (empty = latest)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      WSL_DISTRO: Ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Check the version
        shell: pwsh
        run: |
          node scripts/version.mjs --check
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = (Get-Content VERSION -Raw).Trim()
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "release tag $env:GITHUB_REF_NAME does not match VERSION $version"
            }
          }

      - name: Cache payload dependencies
        uses: actions/cache@v6
        with:
          path: build/prefix
          key: payload-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Resolve the latest PS5 payload SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: node scripts/latest-sdk.mjs

      - name: Set up WSL2
        shell: pwsh
        run: |
          $distros = @(wsl --list --quiet 2>$null)
          if ($distros -notcontains $env:WSL_DISTRO) {
            wsl --install -d $env:WSL_DISTRO --no-launch --web-download
          }
          for ($i = 0; $i -lt 60; $i++) {
            wsl -d $env:WSL_DISTRO -u root -- true 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) {
            throw "WSL distro $env:WSL_DISTRO did not start"
          }
          wsl -d $env:WSL_DISTRO -u root -- bash -lc "cat /etc/os-release"

      - name: Install WSL build dependencies
        shell: pwsh
        run: |
          $script = @'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl wget file unzip tar tcl gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-18 main" |
            tee /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          '@
          function To-WslPath([string]$windowsPath) {
            $drive = $windowsPath.Substring(0, 1).ToLower()
            $rest = $windowsPath.Substring(2).Replace('\', '/')
            return "/mnt/$drive$rest"
          }
          $path = Join-Path $env:RUNNER_TEMP "wsl-deps.sh"
          [IO.File]::WriteAllText($path, ($script -replace "`r`n", "`n"))
          $pathWsl = To-WslPath $path
          wsl -d $env:WSL_DISTRO -u root -- bash "$pathWsl"

      - name: Download the PS5 payload SDK
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ps5-payload-sdk.zip"
          curl.exe -fsSL -o "$zip" "$env:SDK_URL"
          $actual = (Get-FileHash "$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SDK_SHA256) {
            throw "PS5 payload SDK checksum mismatch"
          }

      - name: Build and test the payload in WSL
        shell: pwsh
        run: |
          function To-WslPath([string]$windowsPath) {
            $drive = $windowsPath.Substring(0, 1).ToLower()
            $rest = $windowsPath.Substring(2).Replace('\', '/')
            return "/mnt/$drive$rest"
          }
          $zip = Join-Path $env:RUNNER_TEMP "ps5-payload-sdk.zip"
          $zipWsl = To-WslPath $zip
          $workspace = To-WslPath $env:GITHUB_WORKSPACE
          $script = @'
          set -euo pipefail
          rm -rf /opt/ps5-payload-sdk
          unzip -q "$1" -d /opt
          cd "$2"
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config
          test -x "$LLVM_CONFIG" || { echo "llvm-config not found: $LLVM_CONFIG"; exit 1; }
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" --version
          scripts/build_deps.sh
          make payload
          make test
          '@
          $path = Join-Path $env:RUNNER_TEMP "wsl-build.sh"
          [IO.File]::WriteAllText($path, ($script -replace "`r`n", "`n"))
          $pathWsl = To-WslPath $path
          wsl -d $env:WSL_DISTRO -u root -- bash "$pathWsl" "$zipWsl" "$workspace"

      - name: Install app dependencies
        shell: pwsh
        run: |
          npm ci --prefix ui
          npm ci --prefix app

      - name: Test the app
        shell: pwsh
        run: |
          npm --prefix ui run check
          npm --prefix ui run build
          Push-Location app/src-tauri
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          Pop-Location

      - name: Build the executable
        shell: pwsh
        env:
          Y2JB_PAYLOAD_PREBUILT: "1"
        run: |
          Push-Location app
          npx tauri build --no-bundle
          Pop-Location
          if (-not (Test-Path "app/src-tauri/target/release/y2jb-installer.exe")) {
            throw "the executable was not produced"
          }

      - name: Package the ZIP
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "y2jb-installer_${version}_windows-x64"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item "app/src-tauri/target/release/y2jb-installer.exe" "$name/"
          Copy-Item "packaging/windows/README.txt" "$name/"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          $sums = Join-Path $PWD "SHA256SUMS-windows-x64.txt"
          [IO.File]::WriteAllText($sums, "$hash  $name.zip`n")
          Get-Content $sums

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: windows-x64
          path: |
            y2jb-installer_*_windows-x64.zip
            SHA256SUMS-windows-x64.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "Y2JB Installer $tag" --generate-notes
          }
          $zip = Get-ChildItem "y2jb-installer_*_windows-x64.zip" | Select-Object -First 1
          gh release upload $tag $zip.FullName "SHA256SUMS-windows-x64.txt" --clobber
