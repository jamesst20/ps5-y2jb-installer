name: Linux

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: PS5 payload SDK tag (empty = latest)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Check the version
        run: |
          node scripts/version.mjs --check
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file unzip patchelf tcl gnupg \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

          # The payload SDK needs clang/lld 18; Ubuntu 22.04 ships 14.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-18 main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          echo "LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Cache payload dependencies
        uses: actions/cache@v6
        with:
          path: build/prefix
          key: payload-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Resolve the latest PS5 payload SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: node scripts/latest-sdk.mjs

      - name: Install the PS5 payload SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ps5-payload-sdk.zip" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-clang" --version

      - name: Build and test the payload
        run: |
          scripts/build_deps.sh
          make payload
          make test

      - name: Install app dependencies
        run: |
          npm ci --prefix ui
          npm ci --prefix app

      - name: Test the app
        run: |
          npm --prefix ui run check
          npm --prefix ui run build
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Build the AppImage and deb
        env:
          Y2JB_PAYLOAD_PREBUILT: "1"
        run: |
          cd app
          npx tauri build --bundles appimage,deb

      - name: Write checksums
        run: |
          cd app/src-tauri/target/release/bundle
          { (cd appimage && sha256sum *.AppImage); (cd deb && sha256sum *.deb); } \
            > "$GITHUB_WORKSPACE/SHA256SUMS-linux-${{ matrix.arch }}.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-linux-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: linux-${{ matrix.arch }}
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            SHA256SUMS-linux-${{ matrix.arch }}.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Y2JB Installer $TAG" --generate-notes ||
            true
          gh release upload "$TAG" \
            app/src-tauri/target/release/bundle/appimage/*.AppImage \
            app/src-tauri/target/release/bundle/deb/*.deb \
            "SHA256SUMS-linux-${{ matrix.arch }}.txt" --clobber
