name: macOS

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: PS5 payload SDK tag (empty = latest)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Check the version
        run: |
          node scripts/version.mjs --check
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi

      - name: Cache payload dependencies
        uses: actions/cache@v6
        with:
          path: build/prefix
          key: payload-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Resolve the latest PS5 payload SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: node scripts/latest-sdk.mjs

      - name: Install LLVM and the PS5 payload SDK
        run: |
          brew install llvm@18
          # GITHUB_ENV only applies to later steps; the SDK check below needs it now.
          export LLVM_CONFIG="$(brew --prefix llvm@18)/bin/llvm-config"
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/ps5-payload-sdk.zip" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/ps5-payload-sdk.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-clang" --version

      - name: Build and test the payload
        run: |
          scripts/build_deps.sh
          make payload
          make test

      - name: Install app dependencies
        run: |
          npm ci --prefix ui
          npm ci --prefix app

      - name: Test the app
        run: |
          npm --prefix ui run check
          npm --prefix ui run build
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Build the universal DMG
        env:
          Y2JB_PAYLOAD_PREBUILT: "1"
        run: |
          cd app
          npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Write checksums
        run: |
          cd app/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 ./*.dmg > "$GITHUB_WORKSPACE/SHA256SUMS-macos.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-macos.txt"

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: macos-universal
          path: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS-macos.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Y2JB Installer $TAG" --generate-notes ||
            true
          gh release upload "$TAG" \
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            SHA256SUMS-macos.txt --clobber
